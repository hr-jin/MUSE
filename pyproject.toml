[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-scientific-memory"
version = "0.1.0"
description = "Multi-Level Memory with Selective Runtime Injection for Scientific Coding Agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "openai>=1.50,<3", "jsonschema>=4.18,<5"]

[project.scripts]
muse = "muse.cli:main"

[tool.setuptools.packages.find]
include = ["muse*"]

[tool.setuptools.package-data]
muse = ["*.json", "*.txt", "prompts/*.txt", "prompts/*.json"]
